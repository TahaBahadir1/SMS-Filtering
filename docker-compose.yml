services:
  postgres:
    image: postgres:16
    container_name: sms-filtering-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-sms_filtering}
      POSTGRES_USER: ${DB_USER:-sms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sms_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
