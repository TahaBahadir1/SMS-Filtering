services:
  postgres:
    image: postgres:16
    container_name: sms-filtering-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-sms_filtering}
      POSTGRES_USER: ${DB_USER:-sms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sms_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sms_user} -d ${DB_NAME:-sms_filtering}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: sms-filtering-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-sms_filtering}
      DB_USER: ${DB_USER:-sms_user}
      DB_PASSWORD: ${DB_PASSWORD:-sms_password}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
