spring:
  application:
    name: SMS-Filtering

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sms_filtering}
    username: ${DB_USER:sms_user}
    password: ${DB_PASSWORD:sms_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  tomcat:
    accesslog:
      enabled: false

logging:
  level:
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN

app:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    lookup-per-minute: ${RATE_LIMIT_LOOKUP_PER_MIN:60}
    signal-per-minute: ${RATE_LIMIT_SIGNAL_PER_MIN:20}
    default-per-minute: ${RATE_LIMIT_DEFAULT_PER_MIN:120}
  security:
    signal-api-key: ${SIGNAL_API_KEY:}
